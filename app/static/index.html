<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorties Caen</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-brand">
        <span class="logo">&#9835;</span>
        <h1>Sorties Caen <span id="unseen-badge" class="unseen-badge hidden"></span></h1>
      </div>
      <div class="header-search">
        <input type="search" id="search-input" placeholder="Rechercher un titre, un artiste&#8230;" autocomplete="off" />
      </div>
      <div class="header-actions">
        <button id="btn-scrape" class="btn btn-primary">&#8635; Mettre &#224; jour</button>
        <span id="scrape-status" class="scrape-status"></span>
      </div>
    </div>
  </header>

  <main>

    <!-- Nouvelles dates (seen=false) -->
    <section id="section-new" class="section-new hidden">
      <div class="section-new-header">
        <h2 class="section-title">
          <span class="dot-new"></span>
          Nouvelles dates
          <span id="new-count" class="badge"></span>
        </h2>
        <button id="btn-mark-all-seen" class="btn btn-ghost">Tout marquer comme vu</button>
      </div>
      <div id="new-events-list" class="new-events-list"></div>
    </section>

    <!-- Barre de contrôles : toggle vue + raccourcis + chips salles -->
    <div class="section-controls">
      <div class="view-toggle" role="group" aria-label="Mode d&#39;affichage">
        <button id="btn-view-list" class="toggle-btn active" onclick="setView('list')">&#8801; Liste</button>
        <button id="btn-view-calendar" class="toggle-btn" onclick="setView('calendar')">&#8862; Calendrier</button>
      </div>
      <div class="time-shortcuts">
        <button class="time-btn" data-period="weekend" onclick="setPeriod('weekend')">Ce week-end</button>
        <button class="time-btn" data-period="week"    onclick="setPeriod('week')">Cette semaine</button>
        <button class="time-btn" data-period="month"   onclick="setPeriod('month')">Ce mois</button>
      </div>
      <div id="venue-filters" class="venue-chips-row"></div>
    </div>

    <!-- Vue fil chronologique (défaut) -->
    <section id="view-list">
      <div id="timeline" class="timeline">
        <p class="loading">Chargement&#8230;</p>
      </div>
    </section>

    <!-- Vue calendrier (secondaire) -->
    <section id="view-calendar" class="hidden">
      <div class="section-calendar">
        <div class="calendar-nav">
          <button id="btn-prev" class="nav-btn">&#8249;</button>
          <h2 id="calendar-title" class="calendar-title"></h2>
          <button id="btn-next" class="nav-btn">&#8250;</button>
        </div>
        <div id="calendar" class="calendar-grid"></div>
      </div>
      <div class="section-events-cal">
        <h3 class="section-title" id="cal-events-title">S&#233;lectionnez un jour</h3>
        <div id="cal-events-list" class="timeline"></div>
      </div>
    </section>

  </main>

  <!-- Modal détail événement -->
  <div id="modal" class="modal hidden">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Fermer">&#10005;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
