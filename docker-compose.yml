services:
  sorties-caen:
    build: .
    container_name: sorties-caen
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - DATABASE_PATH=/app/data/sorties_caen.db
    restart: unless-stopped
